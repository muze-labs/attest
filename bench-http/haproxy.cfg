global
    maxconn 200000

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive

frontend attest_tls
    bind 127.0.0.1:4443 ssl crt tls/bench.pem alpn http/1.1
    default_backend attest_backend

backend attest_backend
    http-reuse always
    server attest 127.0.0.1:4000 maxconn 200000
