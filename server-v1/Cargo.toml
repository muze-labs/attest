[package]
name = "muze-temporal-attestation"
version = "0.1.0"
edition = "2021"
description = "Minimal high-throughput temporal attestation service"
license = "MIT"

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
ed25519-dalek = "3.0.0"
getrandom = "0.3.3"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
sha2 = "0.11.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
